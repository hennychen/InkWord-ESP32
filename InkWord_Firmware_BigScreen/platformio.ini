; InkWord BigScreen Firmware - PlatformIO Configuration
; ESP-IDF framework + epdiy V7 并行总线，驱动 ES108FC1C1-RHY 1920x1080 大屏。
; 与 InkWord_Firmware（Arduino + GxEPD2，小屏 SPI）物理隔离：
; 独立 platformio.ini / 独立 sdkconfig / 独立构建产物 / 独立烧录目标，
; GPIO 定义仅存在于本项目 src/driver/board_config.h（方案 §一 隔离红线）。
; 方案文档：.qoder/plans/大屏驱动新项目方案_9a024bb2.md
;
; 方案 §2.2 落地修正记录（与文档差异及原因）：
;   1. 移除 -D CONFIG_IDF_TARGET_ESP32S3=1：espidf 框架下由 sdkconfig 自动
;      定义，命令行再 -D 会触发 macro redefined 警告（零警告纪律）；
;   2. 移除 -D LOG_LOCAL_LEVEL=ESP_LOG_INFO：由 sdkconfig.defaults 的
;      CONFIG_LOG_DEFAULT_LEVEL_INFO=y 覆盖，双通道定义易踩重复定义；
;   3. 移除 board_build.arduino.memory_type = qio_opi：该项仅 Arduino
;      框架生效，espidf 框架的 PSRAM OPI 由 sdkconfig（CONFIG_SPIRAM_MODE_OCT）
;      控制，保留会误导后来者。

[platformio]
default_envs = bigscreen-s3

[env]
; 平台版本勘误（2026-09-12 实测）：方案原文 espressif32@7.0.1（pioarduino），
; 但其 espidf 框架经 registry 解析强制 IDF 6.0.1（framework-espidf
; 4.60001.0），而 epdiy V7 依赖的 rmt_periph_signals / lcd_periph_signals
; 等寄存器描述在 IDF 6.0 已移除，适配等同于重写寄存器级时序（烧屏风险）。
; 固改用 PIO 官方 espressif32@6.12.0（IDF 5.5.3，与 epdiy V7 兼容）。
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = partitions_bigscreen.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; 警告治理基线（零警告纪律）：项目源码全量开警告；epdiy 组件自带
; -Wno-format 等压制（见 components/epdiy/CMakeLists.txt）。
; 若库内仍出格式噪音，先评估库级压制，勿全局 -Wno-format 放水。
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; ---- 主环境：安全 bring-up 起步固件 ----
; 用法：pio run -e bigscreen-s3 -t upload && pio device monitor -b 115200
[env:bigscreen-s3]
upload_speed = 921600
upload_protocol = esptool
build_type = release

; ---- 卖家 demo 复刻环境（A/B 基准）----
; components/epdiy = 卖家 epdiy2 原库（仅 IDF 5.5 编译层适配）；
; 跑 ED060KD1-EpdiyV7 demo 完整流程（ES108FC），用于与
; epdiy_inkword_fixed 修复版组件的输出做 A/B 对照。
; 用法：pio run -e bigscreen-demo -t upload && pio device monitor -b 115200
[env:bigscreen-demo]
extends = env:bigscreen-s3
build_flags =
    -D BIGSCREEN_SELLER_DEMO=1

; ---- Bring-up 探针环境（方案 §3.4 八步测试序列）----
; 编入 src/test/test_basic.c 完整序列（PSRAM→I2C→上电→清屏→像素→
; 灰阶→文字→速率爬升），每步间固定延时供人工确认屏幕状态；
; 非本环境的构建同样链入 test_basic.c 但仅保留安全子集（见源码门控）。
; 用法：pio run -e bigscreen-probe -t upload && pio device monitor -b 115200
[env:bigscreen-probe]
extends = env:bigscreen-s3
build_flags =
    -D BIGSCREEN_PROBE=1

; ---- LAN 图片上传显示环境（适配里程碑 M1）----
; WiFi SoftAP（InkWord-BigScreen / inkword123）+ esp_http_server；
; 浏览器侧抖动为 1bit 裸流上传，设备解包后全屏 GC16 显示（src/lan/）。
; 用法：pio run -e bigscreen-lan -t upload && pio device monitor -b 115200
[env:bigscreen-lan]
extends = env:bigscreen-s3
build_flags =
    -D BIGSCREEN_LAN=1

; ---- 学习机应用环境（小屏功能迁移 Phase A+B，2026-09-16）----
; src/app/ 业务层 + src/gfx/ 绘图层：内嵌词库 + FSRS + 词卡页 +
; 模式状态机（精简版）+ 待机页 + 按键/串口双输入；LAN/probe/demo
; 现有 env 零影响（main.c 分支隔离）。
; 用法：pio run -e bigscreen-app -t upload && pio device monitor -b 115200
[env:bigscreen-app]
extends = env:bigscreen-s3
; build_flags 子 env 覆盖为整体替换（小屏项目 2026-09-01 实测教训），
; 显式 ${env.build_flags} 继承 [env] 段的警告治理基线。
; 注意：pio espidf 的 build_flags 只进 SCons 编译命令，CMake configure
; 看不到（实测 main.c 宏生效但 src/CMakeLists.txt if() 不命中）——
; 源列表/EMBED 的条件编入经 cmake_extra_args 传 CMake 变量。
build_flags =
    ${env.build_flags}
    -D BIGSCREEN_APP=1
board_build.cmake_extra_args = -DBIGSCREEN_APP=1

; ---- 波形调参测试环境（2026-09-18）----
; 标准测试图 + 运行时参数切换，用于系统化扫描 binfast/scanq 最优参数。
; 串口命令：n（下一组参数）、p（上一组）、r（重刷当前）、i（显示信息）。
; 用法：pio run -e bigscreen-tune -t upload && pio device monitor -b 115200
[env:bigscreen-tune]
extends = env:bigscreen-s3
build_flags =
    ${env.build_flags}
    -D BIGSCREEN_TUNE=1
board_build.cmake_extra_args = -DBIGSCREEN_TUNE=1
