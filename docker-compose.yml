# =========================================================
# InkWord 全栈编排 — docker-compose.yml
# 启动：docker compose up -d --build
# 访问：http://localhost (前端) / http://localhost:8080 (后端 API)
# =========================================================

services:
  # ── PostgreSQL 数据库 ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: inkword-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inkword
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 缓存 ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: inkword-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 后端 API (.NET 8) ──────────────────────────
  backend:
    build:
      context: ./InkWord_Backend
      dockerfile: Dockerfile
    container_name: inkword-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ollama 弱依赖：仅保证启动顺序（模型拉取慢，不阻塞后端就绪）
      ollama:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 双下划线 __ 映射 appsettings.json 的层级分隔符 :
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=inkword;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: "InkWord"
      Jwt__Audience: "InkWordAdmin"
      Jwt__Secret: "${JWT_SECRET:-InkWord_Super_Secret_Key_2024_ChangeMe_Please_32+}"
      # M1 AI 内容生成（Ai__* → Ai:*）：容器内经服务名访问 ollama；
      # 切云端（OpenAI 兼容）：AI_PROVIDER=openai + AI_CLOUD_ENDPOINT + AI_CLOUD_API_KEY（.env，不入库）
      Ai__Provider: "${AI_PROVIDER:-ollama}"
      Ai__OllamaUrl: "http://ollama:11434"
      Ai__Model: "${AI_MODEL:-qwen2.5:7b}"
      Ai__CloudApiKey: "${AI_CLOUD_API_KEY:-}"
      Ai__CloudEndpoint: "${AI_CLOUD_ENDPOINT:-}"
      Ai__Concurrency: "${AI_CONCURRENCY:-2}"
      # M3 FSRS 引擎开关：sm2（默认，影子运行）| fsrs（FSRS 生效）
      Srs__Engine: "${SRS_ENGINE:-sm2}"
      # P0B TTS（Tts__* → Tts:*）：容器内 piper 走 volume 挂载，不入镜像层；
      # 首次准备：宿主机 ./data/piper/ 放 piper 二进制 + voices/en_US-lessac-medium.onnx
      Tts__PiperPath: "/data/piper/piper"
      Tts__PiperVoice: "/data/piper/voices/en_US-lessac-medium.onnx"
      # A2 中文音色（free 模式中文回复播报）：宿主机 ./data/piper/voices/
      # 放 zh_CN-huayan-medium.onnx（~63MB，github.com/rhasspy/piper
      # releases zh_CN-huayan-medium）
      Tts__PiperVoiceZh: "/data/piper/voices/zh_CN-huayan-medium.onnx"
      Tts__AudioDir: "/data/audio"
      # P2A ASR（Asr__* → Asr:*）：sherpa-onnx zipformer 模型 volume 挂载
      # （native 库随 NuGet 入镜像，模型不入）；首次准备：宿主机
      # ./data/sherpa/zipformer-en/ 放 encoder/decoder/joiner-epoch-99-avg-1.onnx
      # + tokens.txt（github.com/k2-fsa/sherpa-onnx releases asr-models/
      # sherpa-onnx-zipformer-en-2023-06-26），启用设 ASR_PROVIDER=sherpa。
      # A2 双语升级（代码零改，2026-08-29 已部署达标）：./data/sherpa/
      # zipformer-zh-en/ 放同构 transducer 三件套+tokens
      # （github.com/k2-fsa/sherpa-onnx releases asr-models/
      # sherpa-onnx-zipformer-zh-en-2023-11-22，312MB 包；实际加载
      # int8 encoder + fp32 decoder + int8 joiner）后设 ASR_MODEL_DIR
      # 切换；回退指回 en 目录即回滚（20 句基准 CER 1.3% 记录
      # AI_CHAT_MODE.md §7.3；旧记名 bilingual-zh-en 为误，GitHub 404）
      Asr__Provider: "${ASR_PROVIDER:-none}"
      Asr__ModelDir: "${ASR_MODEL_DIR:-/data/sherpa/zipformer-en}"
    ports:
      - "8080:8080"
    volumes:
      - piperdata:/data/piper
      - audiodata:/data/audio
      - sherpa:/data/sherpa

  # ── Ollama 本地 LLM（M1 路径 B：AI 词库内容增强）──
  # 首次启动需拉模型：docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: inkword-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      # ollama list 即调 GET /api/tags（服务未就绪时退出非零）
      test: ["CMD-SHELL", "ollama list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── 前端管理后台 (Nginx + Angular SPA) ─────────
  frontend:
    build:
      context: ./InkWord_Admin
      dockerfile: Dockerfile
    container_name: inkword-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
  ollamadata:
  piperdata:
  sherpa:
  audiodata:
