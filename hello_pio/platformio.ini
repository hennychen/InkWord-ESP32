; 临时烧录包装：Hello 笔迹演示（最终可调跳帧版）→ 微雪驱动板 ESP32
; 源自 Info/(无主题)/2.9三色带面板/Hello笔迹演示_2.9SSD1680汉朔nebular三色屏/最终可调跳帧
; 板载 CP2102 (/dev/cu.usbserial-0001)；driveboard=1 微雪引脚组，源码零改动
; 用法：pio run -e hello29 -t upload && pio device monitor
[env:hello29]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/cu.usbserial-0001
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
