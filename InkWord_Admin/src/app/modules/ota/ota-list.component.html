<div class="page-header">
  <h2>OTA 升级管理</h2>
  <input type="file" accept=".bin" #fileInput hidden (change)="onUpload($event)" />
  <button mat-raised-button color="primary" (click)="fileInput.click()" [disabled]="uploading()">
    <mat-icon>upload</mat-icon>
    {{ uploading() ? '上传中...' : '上传固件' }}
  </button>
</div>

@if (loading()) {
  <div class="loading-row">
    <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
  </div>
} @else {
  <mat-card>
    <table mat-table [dataSource]="packages()" class="ota-table">
      <ng-container matColumnDef="version">
        <th mat-header-cell *matHeaderCellDef>版本号</th>
        <td mat-cell *matCellDef="let pkg"><strong>{{ pkg.version }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="md5">
        <th mat-header-cell *matHeaderCellDef>MD5</th>
        <td mat-cell *matCellDef="let pkg" class="mono">{{ pkg.md5?.substring(0, 16) }}...</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>描述</th>
        <td mat-cell *matCellDef="let pkg">{{ pkg.description || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>上传时间</th>
        <td mat-cell *matCellDef="let pkg">{{ pkg.createdAt | date: 'yyyy-MM-dd HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="downloadUrl">
        <th mat-header-cell *matHeaderCellDef>下载</th>
        <td mat-cell *matCellDef="let pkg">
          <a [href]="pkg.downloadUrl" target="_blank" mat-icon-button matTooltip="下载">
            <mat-icon>download</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    @if (packages().length === 0) {
      <div class="empty-state">
        <mat-icon>cloud_off</mat-icon>
        <p>暂无固件包</p>
      </div>
    }
  </mat-card>
}
