<div class="page-header">
  <h2>词库管理</h2>
  <div class="header-actions">
    <button mat-raised-button color="primary" (click)="openImport()">
      <mat-icon>upload_file</mat-icon>
      批量导入
    </button>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      新增词条
    </button>
  </div>
</div>

<!-- 搜索与过滤栏 -->
<div class="filter-bar">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>搜索单词/释义</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      [value]="keyword"
      (input)="onSearch($any($event.target).value)"
      placeholder="输入关键字..."
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="tag-field">
    <mat-label>标签过滤</mat-label>
    <input
      matInput
      [value]="tagFilter"
      (input)="onTagFilterChange($any($event.target).value)"
      placeholder="输入标签..."
    />
  </mat-form-field>
</div>

<!-- Loading -->
@if (loading()) {
  <div class="loading-row">
    <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
  </div>
}

<!-- 数据表格 -->
<div class="table-container">
  <table mat-table [dataSource]="dataSource" matSort class="word-table">
    <!-- 单词列 -->
    <ng-container matColumnDef="text">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>单词</th>
      <td mat-cell *matCellDef="let word">{{ word.text }}</td>
    </ng-container>

    <!-- 音标列 -->
    <ng-container matColumnDef="phonetic">
      <th mat-header-cell *matHeaderCellDef>音标</th>
      <td mat-cell *matCellDef="let word">{{ word.phonetic || '—' }}</td>
    </ng-container>

    <!-- 释义列 -->
    <ng-container matColumnDef="definition">
      <th mat-header-cell *matHeaderCellDef>释义</th>
      <td mat-cell *matCellDef="let word" class="definition-cell">{{ word.definition }}</td>
    </ng-container>

    <!-- 标签列 -->
    <ng-container matColumnDef="tags">
      <th mat-header-cell *matHeaderCellDef>标签</th>
      <td mat-cell *matCellDef="let word">
        <mat-chip-set>
          @for (tag of word.tags; track tag) {
            <mat-chip>{{ tag }}</mat-chip>
          }
        </mat-chip-set>
      </td>
    </ng-container>

    <!-- 难度列 -->
    <ng-container matColumnDef="difficulty">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>难度</th>
      <td mat-cell *matCellDef="let word">
        @switch (word.difficulty) {
          @case (1) { <span class="difficulty-easy">简单</span> }
          @case (2) { <span class="difficulty-medium">中等</span> }
          @case (3) { <span class="difficulty-hard">困难</span> }
        }
      </td>
    </ng-container>

    <!-- 操作列 -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>操作</th>
      <td mat-cell *matCellDef="let word">
        <button mat-icon-button (click)="openEdit(word)" matTooltip="编辑">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(word)" matTooltip="删除">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <!-- 分页 -->
  <mat-paginator
    [length]="total"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50, 100]"
    (page)="onPageChange($event)"
    showFirstLastButtons
  >
  </mat-paginator>
</div>
