<h2 mat-dialog-title>{{ isEdit() ? '编辑词条' : '新增词条' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="edit-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>单词 *</mat-label>
      <input matInput formControlName="text" placeholder="如 apple" />
      @if (form.controls.text.hasError('required') && form.controls.text.touched) {
        <mat-error>请输入单词</mat-error>
      }
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>音标</mat-label>
        <input matInput formControlName="phonetic" placeholder="/ˈæp.əl/" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>难度</mat-label>
        <mat-select formControlName="difficulty">
          <mat-option [value]="1">简单</mat-option>
          <mat-option [value]="2">中等</mat-option>
          <mat-option [value]="3">困难</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>释义 *</mat-label>
      <textarea matInput formControlName="meaning" rows="2" placeholder="n. 苹果"></textarea>
      @if (form.controls.meaning.hasError('required') && form.controls.meaning.touched) {
        <mat-error>请输入释义</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>例句</mat-label>
      <textarea matInput formControlName="example" rows="2" placeholder="I eat an apple every day."></textarea>
    </mat-form-field>

    <!-- 词根/派生（V2.1 §6.2 词库扩展 2026-08-20） -->
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>词根词缀</mat-label>
        <input matInput formControlName="root" placeholder="spect=看; vis=看" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>派生变形</mat-label>
        <input matInput formControlName="inflections" placeholder="inspect, inspection" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>标签</mat-label>
        <input matInput formControlName="tag" placeholder="如 中考核心" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>年级</mat-label>
        <input matInput formControlName="grade" placeholder="如 九年级" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>教材来源</mat-label>
        <input matInput formControlName="source" placeholder="如 人教版 九年级 Unit 5" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>音频文件</mat-label>
        <input matInput formControlName="audio" placeholder="apple.mp3" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">取消</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving()">
    {{ saving() ? '保存中...' : '保存' }}
  </button>
</mat-dialog-actions>
