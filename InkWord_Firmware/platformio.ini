; InkWord ESP32-S3 Firmware - PlatformIO Configuration
; Arduino framework + DEPG0370 direct SPI e-paper driver (no IT8951)

[platformio]
default_envs = inkword-s3

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 使用本地已安装的包（避免网络下载超时）
platform_packages =
    framework-arduinoespressif32 @ file:///Users/pm/.platformio/packages/framework-arduinoespressif32
    toolchain-xtensa-esp32s3 @ file:///Users/pm/.platformio/packages/toolchain-xtensa-esp32s3
    tool-scons @ file:///Users/pm/.platformio/packages/tool-scons

; 显示驱动：GxEPD2 (UC8253 类 COG 屏) + Adafruit GFX 绘图栈
; BLE 配网：NimBLE（1.4.x 兼容 core 2.0.17 / IDF 4.4；2.x 需 core 3.x）
lib_deps =
    ZinggJM/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
    h2zero/NimBLE-Arduino @ ^1.4.3

; P3 阅读器三级点阵字库（~631KB）：objcopy 嵌入（arduino 框架不走 src/ CMakeLists，
; 须用本项；链接符号 _binary_src_cjk_font_data_bin_start，cjk_font.c 引用）
board_build.embed_files =
    src/cjk_font_data.bin

; 保留 INFO 级静态日志（预编译 sdkconfig 默认 ERROR 会裁剪 ESP_LOGI，
; 运行时级别由 log_init() 设为 INFO，需静态级别同步才可见）
build_flags =
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
    -Wall
    -Wextra
    -Wno-unused-parameter
; NimBLE 裁剪：仅外围设备单连接（本机只做 GATT server，
; 裁掉 central/observer 角色省 host 内存，见 ble_provision.cpp）
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ---- Main target environment ----
[env:inkword-s3]
board_build.partitions = partitions_default.csv
upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --before=default_reset
    --after=hard_reset
build_type = release

; 16MB Flash module
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; ---- Demo/test env：内嵌 5 词演示词库，无 SD 卡也能进学习页验证按键 ----
; 同步内嵌演示书（READER 模式）：验证分页/变宽排版/三级字号/进度。
; 用法：pio run -e inkword-s3-demo -t upload（测完烧回 inkword-s3 恢复正式行为）
[env:inkword-s3-demo]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_DEMO_WORDS=1
    -D INKWORD_DEMO_BOOK=1

; ---- 4.2" E042A13 三色面板 env（面板轴构建矩阵，PANEL_COMPAT_DESIGN
; §14.1）：同板级同引脚，仅 INKWORD_PANEL_E042A13 切换默认面板
; （epd_panel.h EPD_PANEL_DEFAULT_ID 条件选择 → e042a13_ssd1619）。
; 用法：pio run -e inkword-s3-e042 -t upload（测完烧回 inkword-s3 换回 3.7" 屏）。
; 三色屏无快速局刷、全刷实测 14.6s：待机自动轮换停用等 UX 降级自动生效（§13.2）
[env:inkword-s3-e042]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_E042A13=1

; ---- 2.7" WF0270 三色面板 env（SSD1680，22Pin 0.5mm FPC，维峰
; WF0270T1PCZ2200E4；面板轴构建矩阵第三个成员，同 E042A13 先例）。
; 用法：pio run -e inkword-s3-wf0270 -t upload（测完烧回 inkword-s3 换回默认屏）。
; 几何：COG 竖屏 176x264 + gfx_rotation=1 → UI 横屏 264x176（LAYOUT_SMALL 首例）
[env:inkword-s3-wf0270]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_WF0270=1

; ---- 2.7" GDEW027C44 三色面板 env（IL91874/EK79652，24Pin，2026-08-22
; 真机 bring-up 完成：实物与原判 WF0270 不同型，判族证据 BUSY idle=HIGH
; + GxEPD2_270c 序列点亮，全刷实测 14.7s）。面板轴构建矩阵第四成员。
; 用法：pio run -e inkword-s3-gdew027c44 -t upload（测完烧回 inkword-s3 换回默认屏）。
; 几何：COG 竖屏 176x264 + gfx_rotation=1 → UI 横屏 264x176（LAYOUT_SMALL）
[env:inkword-s3-gdew027c44]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_GDEW027C44=1