; InkWord ESP32-S3 Firmware - PlatformIO Configuration
; Arduino framework + DEPG0370 direct SPI e-paper driver (no IT8951)

[platformio]
default_envs = inkword-s3

; env 三类定位（P3 工程自文档；详情见各 env 段注释）：
;   ① 发布固件：inkword-s3 —— 统一固件，运行期 NVS "inkword"/set_panel
;      选屏（epd_driver 读，多屏生产路径；其余设备 env 均经 extends 继承）；
;   ② 面板开发 env：e042/wf0270/gdew027c44/e042bw/wft0290/opm021eb
;      —— extends inkword-s3，编译期注入 EPD_PANEL_DEFAULT_ID 钉默认
;      （免 NVS 直测新屏，bring-up 便利；id 直达 epd_panel_get_by_id 注册表）；
;   ③ 专项 env：inkword-s3-demo（内嵌演示词库+黄金帧自检，跑完挂起）、
;      opm021eb-probe（屏驱探针，src/probe/ 单文件 setup/loop）、
;      native-test（host 纯算法单测，M4 FSRS 双端对拍）。

[env]
platform = espressif32@7.0.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 探针程序（src/probe/*.cpp，独立 setup/loop）仅在对应探针环境编译
; （其 build_src_filter 显式覆盖 +<probe/...>）；其余环境一律整目录
; 排除，防与正式 main.cpp 双 main 链接冲突（二十七轮探针引入时实测）。
; 桩目录（src/stubs/*.c，开源通用化 Phase 1）同理：默认排除，防与
; 真实现 duplicate symbol；仅 inkword-s3-offline 显式 +<stubs/> 加回
build_src_filter = +<*> -<probe/> -<stubs/>

; 包钉版（registry 版本号，任何环境可直接构建，本机缓存命中）：
; framework 3.20017 = Arduino core 2.0.17（NimBLE 1.4.x 兼容线）；
; toolchain_stubs.c 已弱符号化，默认 8.4/钉 14.2 两代工具链均可链接
platform_packages =
    framework-arduinoespressif32 @ 3.20017.241212
    tool-scons @ 4.40801.0

; 显示驱动：GxEPD2 (UC8253 类 COG 屏) + Adafruit GFX 绘图栈
; BLE 配网：NimBLE（1.4.x 兼容 core 2.0.17 / IDF 4.4；2.x 需 core 3.x）
lib_deps =
    ZinggJM/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
    h2zero/NimBLE-Arduino @ ^1.4.3

; P3 阅读器三级点阵字库（~631KB）+ 出厂兜底词库（~568KB，2026-08-23）：
; objcopy 嵌入（arduino 框架不走 src/ CMakeLists，须用本项；
; 链接符号 _binary_src_<文件名去点>_start，cjk_font.c / main.cpp 引用）。
; 词库无 SD 卡时开箱即用（main.cpp 兜底分支），生成链
; tools/default_vocab/gen_default_vocab.py，更新后须同步重烧固件
board_build.embed_files =
    src/cjk_font_data.bin
    src/default_words.json
    src/test_voice.wav

; 保留 INFO 级静态日志（预编译 sdkconfig 默认 ERROR 会裁剪 ESP_LOGI，
; 运行时级别由 log_init() 设为 INFO，需静态级别同步才可见）
build_flags =
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
; MP3 解码（P0A 2026-08-24）：src/mp3/ 内嵌 libhelix（来源与裁剪说明见
; src/mp3/README.md），audio_player.c 按此宏启用解码路径，全 env 生效
    -D HAVE_LIBHELIX_MP3
; EPD bring-up 诊断开关（T1.8，修 E2）：默认生产——未定义时 epd_bus.h
; 按 0 兜底（诊断序列不编入，体积 -4~6KB，启动无 EPD-DIAG 段）；
; demo/probe env 显式 -D INKWORD_EPD_DIAG=1 完整保留。
; [env] 不预定义 -D 0：与子 env 的 -D 1 叠加会触发 "redefined"
; 重复定义警告（全 env clean 构建实锤，2026-09-05 移除）
    -Wall
    -Wextra
    -Wno-unused-parameter
; 框架级格式噪音压制（2026-09-02）：Arduino-ESP32 3.x 的 esp_log 内部
; 模板用 %lu 打 esp_log_timestamp()（uint32_t），每次 LOG 宏展开都告
; -Wformat（全项目 ~百处，非项目代码问题）；项目自身 snprintf 截断
; 风险已在源头用精度限制/扩容修复（browse/chat_ui/voice_search）。
    -Wno-format
; NimBLE 裁剪：仅外围设备单连接（本机只做 GATT server，
; 裁掉 central/observer 角色省 host 内存，见 ble_provision.cpp）
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ---- Main target environment ----
[env:inkword-s3]
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_default.csv
upload_speed = 921600
upload_protocol = esptool
; Flash 布局修正（2026-08-25 真机 boot loop 根治）：nvs 192KB 扩容后
; factory@0x40000 的表，PIO 按 0x10000 兜底烧 app、boot_app0 烧 0xe000
; 污染 nvs；脚本钉死 app→factory、boot_app0→otadata（见 tools/flash_layout_fix.py）
; Core/App 分层守卫（开源通用化 Phase 2）：pre 阶段扫 include 图，
; 违规先 warn 不阻塞（白名单 tools/layering_whitelist.txt；稳定后升
; --strict）——所有设备 env 经 extends 继承；native-test 不适用（host）
extra_scripts =
    tools/flash_layout_fix.py
    pre:tools/check_layering.py
upload_flags =
    --before=default_reset
    --after=hard_reset
build_type = release
; 后端地址：生产默认 https://api.einkword.com（sync_client.c 内置），
; 私有部署用子 env 或命令行 -D INKWORD_API_BASE="..." 覆盖。
; 教训（2026-09-01 真机实测踩坑，临时指向本机的实验段已删）：
; 子 env 覆盖 build_flags 是整体替换非叠加，会踢掉 [env] 全部 flags
; （LOG_LOCAL_LEVEL 被裁后真机只剩 E 级日志、HAVE_LIBHELIX_MP3 被裁后
; MP3 播放路径消失）——子 env 必须显式 ${env.build_flags} 继承。

; 16MB Flash module
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; ---- Demo/test env：内嵌 5 词演示词库，无 SD 卡也能进学习页验证按键 ----
; 同步内嵌演示书（READER 模式）：验证分页/变宽排版/三级字号/进度。
; 用法：pio run -e inkword-s3-demo -t upload（测完烧回 inkword-s3 恢复正式行为）
[env:inkword-s3-demo]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_DEMO_WORDS=1
    -D INKWORD_DEMO_BOOK=1
    -D INKWORD_EPD_DIAG=1   ; T1.8：demo 屏保 bring-up 诊断完整保留
    -D INKWORD_GOLDEN_FRAME=1 ; T2.2：黄金帧自检（开机跑序列+dump，跑完挂起；
                            ; 基线生成/更新流程见 src/selftest_golden.h 头注释）

; ---- 离线单机学习档（开源通用化 Phase 1）：裁五轴——音频/云/AI/
; WiFi/LAN，宏权威 src/inkword_features.h，桩实现 src/stubs/ 顶替
; 被裁源（头文件原样保留→业务文件零改动，桩语义见各桩头注释）。
; 保留闭环：显示栈+五向按键+词库+FSRS+阅读器+待机页（引文留白）。
; 用法：pio run -e inkword-s3-offline -t upload
; 四项覆盖均为整体替换非叠加（[env:inkword-s3] 段教训同源），
; 故显式 ${...} 继承 / 全量重列：
[env:inkword-s3-offline]
extends = env:inkword-s3
; 16 被裁源逐项排除（lan_proto.c 无需桩——唯一调用者
; lan_display_server.cpp 已裁，无引用即无链接需求）。
; ${env.build_src_filter} 已含 -<stubs/>，尾部 +<stubs/> 顺序加回
build_src_filter =
    ${env.build_src_filter}
    -<audio_player.c> -<es8311.c> -<mic_recorder.c> -<ui_sfx.c>
    -<audio_sync.c> -<sync_client.c> -<sync_session.cpp> -<ota_manager.c>
    -<chat_mode.c> -<chat_ui.c> -<voice_search.c>
    -<wifi_manager.c> -<wifi_config_ui.c> -<ble_provision.cpp>
    -<lan_display_server.cpp> -<lan_proto.c>
    +<stubs/>
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_FEATURE_AUDIO=0
    -D INKWORD_FEATURE_CLOUD=0
    -D INKWORD_FEATURE_AI=0
    -D INKWORD_FEATURE_WIFI=0
    -D INKWORD_FEATURE_LAN=0
; 去 NimBLE：BLE 配网随 WIFI 轴裁（省 ~300KB flash）
lib_deps =
    ZinggJM/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
; 裁 test_voice.wav（符号仅 audio_player.c 引用，已随 AUDIO 轴裁）
board_build.embed_files =
    src/cjk_font_data.bin
    src/default_words.json

; ---- 4.2" E042A13 三色面板 env（面板轴构建矩阵，PANEL_COMPAT_DESIGN
; §14.1）：同板级同引脚，仅 EPD_PANEL_DEFAULT_ID 切换默认面板
; （默认面板 id → e042a13_ssd1619，注册表查表在 epd_panel.c）。
; 用法：pio run -e inkword-s3-e042 -t upload（测完烧回 inkword-s3 换回 3.7" 屏）。
; 三色屏无快速局刷、全刷实测 14.6s：待机自动轮换停用等 UX 降级自动生效（§13.2）
[env:inkword-s3-e042]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="e042a13_ssd1619"'

; ---- 2.7" WF0270 三色面板 env（SSD1680，22Pin 0.5mm FPC，维峰
; WF0270T1PCZ2200E4；面板轴构建矩阵第三个成员，同 E042A13 先例）。
; 用法：pio run -e inkword-s3-wf0270 -t upload（测完烧回 inkword-s3 换回默认屏）。
; 几何：COG 竖屏 176x264 + gfx_rotation=1 → UI 横屏 264x176（LAYOUT_SMALL 首例）
[env:inkword-s3-wf0270]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="wf0270_ssd1680"'

; ---- 2.7" GDEW027C44 三色面板 env（IL91874/EK79652，24Pin，2026-08-22
; 真机 bring-up 完成：实物与原判 WF0270 不同型，判族证据 BUSY idle=HIGH
; + GxEPD2_270c 序列点亮，全刷实测 14.7s）。面板轴构建矩阵第四成员。
; 用法：pio run -e inkword-s3-gdew027c44 -t upload（测完烧回 inkword-s3 换回默认屏）。
; 几何：COG 竖屏 176x264 + gfx_rotation=1 → UI 横屏 264x176（LAYOUT_SMALL）
[env:inkword-s3-gdew027c44]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="gdew027c44_il91874"'

; ---- 以下两个 env 为 2026-08-23 新增骨架（屏在途，驱动序列未
; bring-up）：仅面板轴/env 预留与编译验证可用，烧录后 epd_driver_init
; 在 fail-safe 桩处报错退出（屏无输出），bring-up 后方可真机使用。
; 几何/档位已定：wft0290=128x296 / opm021eb=122x250 竖屏 TINY

; ---- 4.2" E042A13-A0 黑白版 env（400x300 BW，SSD1619，三色兄弟屏
; 同族，2026-08-30 bring-up 完成：0x22/0xF7 实证（0xC7 空转教训），
; 全刷实测 2.9s，比三色 14.6s 快 5 倍）。
; 用法：pio run -e inkword-s3-e042bw -t upload
[env:inkword-s3-e042bw]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="e042a13bw_ssd1619"'

; ---- 3.1" GDEQ031T10 黑白 env（240x320 BW，UC8253，24P FPC 0.5mm，
; 2026-09-05 demo 序列已接入，PSR 单字节 0x1F 与 DEPG0370 不同）。
; 几何：COG 240x320 + gfx_rotation=1 → UI 横屏 320x240（LAYOUT_MID）
; 用法：pio run -e inkword-s3-gdeq031t10 -t upload
[env:inkword-s3-gdeq031t10]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="gdeq031t10_uc8253"'

; ---- 2.9" WFT0290CZ10 黑白 env（128x296 BW 竖屏，电子价签源，
; 控制器 UC8253/SSD1680 两族候选待实测判定）。
; 几何：COG 竖屏 128x296 + gfx_rotation=0 → UI 竖屏 128x296（LAYOUT_TINY）
; 用法：pio run -e inkword-s3-wft0290（bring-up 前勿 upload）
[env:inkword-s3-wft0290]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="wft0290_bw"'

; ---- 2.13" OPM021EB 黑白 env（122x250 BW 竖屏，电子标签，疑似
; SSD1680 待实证；当前最小屏）。
; 几何：COG 竖屏 122x250 + gfx_rotation=0 → UI 竖屏 122x250（LAYOUT_TINY）
; 用法：pio run -e inkword-s3-opm021eb（bring-up 前勿 upload）
[env:inkword-s3-opm021eb]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="opm021eb_bw"'

; ---- 2.13" HINK-E0213A31 黑白 env（122x250 BW 竖屏，微雪/合晶标准屏，
; SSD1680，GxEPD2 B74 序列，与 OPM021EB 不同控制器）。
; 几何：COG 128x250（RAM 16B/行），可见 122x250，gfx_rotation=0（LAYOUT_TINY）
; 用法：pio run -e inkword-s3-hink213 -t upload
[env:inkword-s3-hink213]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="hink_e0213a31_bw"'

; ---- 4.26" GDEQ0426T82 黑白 env（800x480 BW，SSD1677，17P FPC，
; 2026-09-06 新增，Good Display 官方 demo 序列已接入，bring-up 待真机）。
; 几何：原生横向 800x480 + gfx_rotation=0 → UI 横屏 800x480
; （LAYOUT_LARGE 档首例，档位几何为预估值待上机校准）；
; 帧预算 48KB x3=144KB > 128KB 阈值 → PSRAM（现役首块 PSRAM 帧 BW 面板）。
; 用法：pio run -e inkword-s3-gdeq0426 -t upload
[env:inkword-s3-gdeq0426]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    '-D EPD_PANEL_DEFAULT_ID="gdeq0426t82_ssd1677"'

; ---- OPM021EB 探针环境（当前：打断+双写组合，四十轮）----
; probe_opm_dw_abort.cpp：双写(0x10+0x13)序列 + X=250~2000ms
; POF 打断扫描——快刷夏活实验（遗留可选项）。
; 旧探针：probe_opm_{dram,abort,seq,seq2,tsw,otp}.cpp / probe_gxepd2
; _uc8151d.cpp 归档 src/probe/，换 build_src_filter 路径即可切换。
; 用法：pio run -e opm021eb-probe -t upload && pio device monitor -b 115200
; 测完烧回：pio run -e inkword-s3-opm021eb -t upload

; ---- GDEQ031T10 3.1" 屏 BUSY 探针环境（2026-09-05）----
; 用法：pio run -e gdeq031t10-probe -t upload && pio device monitor -b 115200
[env:gdeq031t10-probe]
extends = env:inkword-s3
build_src_filter = +<probe/probe_gdeq031t10_busy.cpp>
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_EPD_DIAG=1
[env:opm021eb-probe]
extends = env:inkword-s3
build_src_filter = +<probe/probe_opm_dw_abort.cpp>
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_EPD_DIAG=1   ; T1.8：探针 env 诊断完整保留

; ---- HINK-E0213A31 通电自检探针（2026-09-05）----
; 验证 SSD1680 COG 响应 + BUSY 极性 + 版本寄存器
; 用法：pio run -e hink213-probe -t upload && pio device monitor -b 115200
[env:hink213-probe]
extends = env:inkword-s3
build_src_filter = +<probe/probe_hink_alive.cpp>
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_EPD_DIAG=1

; ---- GPIO 电平扫描探针（2026-09-05）----
; 检测所有按键引脚的原始电平，判断硬件状态
; 用法：pio run -e gpio-scan -t upload && pio device monitor -b 115200
[env:gpio-scan]
extends = env:inkword-s3
build_src_filter = +<probe/probe_gpio_scan.cpp>
build_flags =
    ${env:inkword-s3.build_flags}

; ---- 按键硬件测试探针（2026-09-05）----
; 验证五向导航按键硬件是否正常工作
; 用法：pio run -e button-test -t upload && pio device monitor -b 115200
[env:button-test]
extends = env:inkword-s3
build_src_filter = +<probe/probe_button_test.cpp>
build_flags =
    ${env:inkword-s3.build_flags}

; ---- HINK-E0213A31 自定义 LUT 局部刷新探针（2026-09-05）----
; 基于 Waveshare V3 驱动方案：上传 153 字节自定义波形到 0x32，使用 0x0F 触发
; 用法：pio run -e hink213-custom-lut -t upload && pio device monitor -b 115200
[env:hink213-custom-lut]
extends = env:inkword-s3
build_src_filter = +<probe/probe_hink_custom_lut.cpp>
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_EPD_DIAG=1

; ---- HINK-E0213A31 强制全刷恢复探针（2026-09-05）----
; 恢复屏幕正常显示（清除探针残留状态）
; 用法：pio run -e hink213-recover -t upload
[env:hink213-recover]
extends = env:inkword-s3
build_src_filter = +<probe/probe_hink_recover.cpp>
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_EPD_DIAG=1

; ---- BS 引脚检查探针（2026-09-05）----
; 验证 J2-10（原 BS 引脚）是否为 LOW（4 线 SPI 模式）
; 用法：pio run -e bs-check -t upload && pio device monitor -b 115200
[env:bs-check]
extends = env:inkword-s3
build_src_filter = +<probe/probe_bs_check.cpp>
build_flags =
    ${env:inkword-s3.build_flags}


; ---- 纯算法单元测试（host 编译，无硬件依赖；M4 FSRS 双端对拍）----
; 用法：pio test -e native-test
; 向量头 test/fsrs_vectors.h 由 tools/gen_fsrs_vectors.py 生成（勿手改），
; 与后端 FsrsServiceTests 读同一 CSV 源（双端对拍纪律）。
; word_parser 云导出回放（2026-08-23）：WORDS_JSON=<export.json> 时生效，
; 缺省 IGNORE；cJSON 源码在 test/cJSON.c，ESP 依赖 stub 头在 test/stubs/
; （-I 顺序优先命中，不影响设备构建）。
[env:native-test]
platform = native
; 覆盖 [env] 继承：清空 arduino 库与本地包，native 仅 Unity 对拍
lib_deps =
platform_packages =
; native 平台所有 test 文件链入同一 program：单 main 纪律，
; runner 统一在 test_srs_engine.c，新测试挂 RUN_TEST 勿新建 main
; src 代码链入测试程序（filter 仅取被测纯 C 源，排除 Arduino main.cpp）。
; 开源通用化 Phase 1.5：+page_router（栈协议；debug_log 依赖经 esp_log
; stub 兼容）+epd_panel（desc 契约矩阵；panels/*.cpp 的 g_panel_*
; 链接位由 test/test_epd_panel.c stub desc 顶替）
test_build_src = yes
build_src_filter = +<srs_engine.c> +<word_parser.c> +<quiz_session.c> +<card_layout.c> +<cjk_font_sd.c> +<daily_plan.c> +<catalog_index.c> +<epd_geom.c> +<selftest_diff.c> +<lan_proto.c> +<layout_profile.c> +<page_router.c> +<epd_panel.c>
build_flags =
    -I test/stubs
    -I test        ; cJSON.h（test/cJSON.c 同目录；2026-08-23 build_src_filter 纳入 word_parser.c 后必需）
    -I src
    -std=c11
