; InkWord ESP32-S3 Firmware - PlatformIO Configuration
; Arduino framework + DEPG0370 direct SPI e-paper driver (no IT8951)

[platformio]
default_envs = inkword-s3

[env]
platform = espressif32@7.0.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 包钉版（registry 版本号，任何环境可直接构建，本机缓存命中）：
; framework 3.20017 = Arduino core 2.0.17（NimBLE 1.4.x 兼容线）；
; toolchain_stubs.c 已弱符号化，默认 8.4/钉 14.2 两代工具链均可链接
platform_packages =
    framework-arduinoespressif32 @ 3.20017.241212
    tool-scons @ 4.40801.0

; 显示驱动：GxEPD2 (UC8253 类 COG 屏) + Adafruit GFX 绘图栈
; BLE 配网：NimBLE（1.4.x 兼容 core 2.0.17 / IDF 4.4；2.x 需 core 3.x）
lib_deps =
    ZinggJM/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
    h2zero/NimBLE-Arduino @ ^1.4.3

; P3 阅读器三级点阵字库（~631KB）+ 出厂兜底词库（~568KB，2026-08-23）：
; objcopy 嵌入（arduino 框架不走 src/ CMakeLists，须用本项；
; 链接符号 _binary_src_<文件名去点>_start，cjk_font.c / main.cpp 引用）。
; 词库无 SD 卡时开箱即用（main.cpp 兜底分支），生成链
; tools/default_vocab/gen_default_vocab.py，更新后须同步重烧固件
board_build.embed_files =
    src/cjk_font_data.bin
    src/default_words.json

; 保留 INFO 级静态日志（预编译 sdkconfig 默认 ERROR 会裁剪 ESP_LOGI，
; 运行时级别由 log_init() 设为 INFO，需静态级别同步才可见）
build_flags =
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
; MP3 解码（P0A 2026-08-24）：src/mp3/ 内嵌 libhelix（来源与裁剪说明见
; src/mp3/README.md），audio_player.c 按此宏启用解码路径，全 env 生效
    -D HAVE_LIBHELIX_MP3
    -Wall
    -Wextra
    -Wno-unused-parameter
; NimBLE 裁剪：仅外围设备单连接（本机只做 GATT server，
; 裁掉 central/observer 角色省 host 内存，见 ble_provision.cpp）
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ---- Main target environment ----
[env:inkword-s3]
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_default.csv
upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --before=default_reset
    --after=hard_reset
build_type = release

; 16MB Flash module
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; ---- Demo/test env：内嵌 5 词演示词库，无 SD 卡也能进学习页验证按键 ----
; 同步内嵌演示书（READER 模式）：验证分页/变宽排版/三级字号/进度。
; 用法：pio run -e inkword-s3-demo -t upload（测完烧回 inkword-s3 恢复正式行为）
[env:inkword-s3-demo]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_DEMO_WORDS=1
    -D INKWORD_DEMO_BOOK=1

; ---- 4.2" E042A13 三色面板 env（面板轴构建矩阵，PANEL_COMPAT_DESIGN
; §14.1）：同板级同引脚，仅 INKWORD_PANEL_E042A13 切换默认面板
; （epd_panel.h EPD_PANEL_DEFAULT_ID 条件选择 → e042a13_ssd1619）。
; 用法：pio run -e inkword-s3-e042 -t upload（测完烧回 inkword-s3 换回 3.7" 屏）。
; 三色屏无快速局刷、全刷实测 14.6s：待机自动轮换停用等 UX 降级自动生效（§13.2）
[env:inkword-s3-e042]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_E042A13=1

; ---- 2.7" WF0270 三色面板 env（SSD1680，22Pin 0.5mm FPC，维峰
; WF0270T1PCZ2200E4；面板轴构建矩阵第三个成员，同 E042A13 先例）。
; 用法：pio run -e inkword-s3-wf0270 -t upload（测完烧回 inkword-s3 换回默认屏）。
; 几何：COG 竖屏 176x264 + gfx_rotation=1 → UI 横屏 264x176（LAYOUT_SMALL 首例）
[env:inkword-s3-wf0270]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_WF0270=1

; ---- 2.7" GDEW027C44 三色面板 env（IL91874/EK79652，24Pin，2026-08-22
; 真机 bring-up 完成：实物与原判 WF0270 不同型，判族证据 BUSY idle=HIGH
; + GxEPD2_270c 序列点亮，全刷实测 14.7s）。面板轴构建矩阵第四成员。
; 用法：pio run -e inkword-s3-gdew027c44 -t upload（测完烧回 inkword-s3 换回默认屏）。
; 几何：COG 竖屏 176x264 + gfx_rotation=1 → UI 横屏 264x176（LAYOUT_SMALL）
[env:inkword-s3-gdew027c44]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_GDEW027C44=1

; ---- 以下三个 env 为 2026-08-23 新增骨架（屏在途，驱动序列未
; bring-up）：仅面板轴/env 预留与编译验证可用，烧录后 epd_driver_init
; 在 fail-safe 桩处报错退出（屏无输出），bring-up 后方可真机使用。
; 几何/档位已定：e042bw=400x300 MID（UI 零改动即适配）、
; wft0290=128x296 / opm021eb=122x250 竖屏 TINY（2026-08-23 新增档）

; ---- 4.2" E042A13-A0 黑白版 env（400x300 BW，初判 SSD1619，三色
; 同型兄弟屏已实证；序列待 bring-up 回填，可大量参考
; panel_e042a13_ssd1619 去红平面）。
; 用法：pio run -e inkword-s3-e042bw（bring-up 前勿 upload）
[env:inkword-s3-e042bw]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_E042A13BW=1

; ---- 2.9" WFT0290CZ10 黑白 env（128x296 BW 竖屏，电子价签源，
; 控制器 UC8253/SSD1680 两族候选待实测判定）。
; 几何：COG 竖屏 128x296 + gfx_rotation=0 → UI 竖屏 128x296（LAYOUT_TINY）
; 用法：pio run -e inkword-s3-wft0290（bring-up 前勿 upload）
[env:inkword-s3-wft0290]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_WFT0290=1

; ---- 2.13" OPM021EB 黑白 env（122x250 BW 竖屏，电子标签，疑似
; SSD1680 待实证；当前最小屏）。
; 几何：COG 竖屏 122x250 + gfx_rotation=0 → UI 竖屏 122x250（LAYOUT_TINY）
; 用法：pio run -e inkword-s3-opm021eb（bring-up 前勿 upload）
[env:inkword-s3-opm021eb]
extends = env:inkword-s3
build_flags =
    ${env:inkword-s3.build_flags}
    -D INKWORD_PANEL_OPM021EB=1

; ---- 纯算法单元测试（host 编译，无硬件依赖；M4 FSRS 双端对拍）----
; 用法：pio test -e native-test
; 向量头 test/fsrs_vectors.h 由 tools/gen_fsrs_vectors.py 生成（勿手改），
; 与后端 FsrsServiceTests 读同一 CSV 源（双端对拍纪律）。
; word_parser 云导出回放（2026-08-23）：WORDS_JSON=<export.json> 时生效，
; 缺省 IGNORE；cJSON 源码在 test/cJSON.c，ESP 依赖 stub 头在 test/stubs/
; （-I 顺序优先命中，不影响设备构建）。
[env:native-test]
platform = native
; 覆盖 [env] 继承：清空 arduino 库与本地包，native 仅 Unity 对拍
lib_deps =
platform_packages =
; native 平台所有 test 文件链入同一 program：单 main 纪律，
; runner 统一在 test_srs_engine.c，新测试挂 RUN_TEST 勿新建 main
; src 代码链入测试程序（filter 仅取被测纯 C 源，排除 Arduino main.cpp）
test_build_src = yes
build_src_filter = +<srs_engine.c> +<word_parser.c> +<quiz_session.c> +<card_layout.c> +<cjk_font_sd.c> +<daily_plan.c>
build_flags =
    -I test/stubs
    -I test        ; cJSON.h（test/cJSON.c 同目录；2026-08-23 build_src_filter 纳入 word_parser.c 后必需）
    -I src
    -std=c11
