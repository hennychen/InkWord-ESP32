; InkWord ESP32-S3 Firmware - PlatformIO Configuration
; Based on ESP-IDF framework with EPDiy e-paper driver

[platformio]
default_envs = inkword-s3

; ---- Common settings shared by all environments ----
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; EPDiy e-paper driver + JSON parsing library
lib_deps =
    vroland/epdiy @ ^7.0.0

build_flags =
    ; Chip configuration
    -D CONFIG_IDF_TARGET_ESP32S3=1
    ; EPDiy: select the e-paper board profile (ED097TC2 9.7" landscape)
    -D CONFIG_EPD_BOARD_V7_V3=1
    -D CONFIG_EPD_DISPLAY_TYPE_ED097TC2=1
    ; Enable warnings for safer development
    -Wall
    -Wextra

; ---- Main target environment ----
[env:inkword-s3]
board_build.partitions = partitions_default.csv
upload_speed = 921600
build_type = release

; Allow flash size for OTA (16MB module)
board_upload.flash_size = 16MB
